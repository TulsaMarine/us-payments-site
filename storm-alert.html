<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>⚠️ STORM ALERT</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Pulsing red border */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    border: 6px solid #e74c3c;
    pointer-events: none;
    z-index: 10;
    animation: pulse-border 1.5s ease-in-out infinite;
  }

  @keyframes pulse-border {
    0%, 100% { border-color: #e74c3c; box-shadow: inset 0 0 60px rgba(231,76,60,0.15); }
    50% { border-color: #ff6b6b; box-shadow: inset 0 0 120px rgba(231,76,60,0.25); }
  }

  /* Scanning line effect */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, transparent, #e74c3c, transparent);
    z-index: 11;
    animation: scan 3s linear infinite;
  }

  @keyframes scan {
    0% { top: 0; }
    100% { top: 100vh; }
  }

  /* Subtle radar sweep background */
  .radar-bg {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    border: 1px solid rgba(231,76,60,0.1);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
  }

  .radar-bg::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(231,76,60,0.08) 30deg, transparent 60deg);
    animation: sweep 4s linear infinite;
  }

  @keyframes sweep {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .radar-ring {
    position: fixed;
    border-radius: 50%;
    border: 1px solid rgba(231,76,60,0.08);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
  }

  .ring-1 { width: 300px; height: 300px; }
  .ring-2 { width: 450px; height: 450px; }
  .ring-3 { width: 600px; height: 600px; }

  .content {
    position: relative;
    z-index: 5;
    text-align: center;
    max-width: 700px;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .alert-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(231,76,60,0.15);
    border: 1px solid rgba(231,76,60,0.5);
    padding: 8px 20px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    color: #ff6b6b;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 24px;
    animation: badge-pulse 2s ease-in-out infinite;
  }

  @keyframes badge-pulse {
    0%, 100% { background: rgba(231,76,60,0.15); }
    50% { background: rgba(231,76,60,0.25); }
  }

  .alert-badge .dot {
    width: 10px; height: 10px;
    background: #e74c3c;
    border-radius: 50%;
    animation: dot-blink 1s ease-in-out infinite;
  }

  @keyframes dot-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .icon {
    font-size: 72px;
    margin-bottom: 16px;
    animation: icon-bounce 2s ease-in-out infinite;
  }

  @keyframes icon-bounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  h1 {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #ff6b6b, #e74c3c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 22px;
    color: #ccc;
    margin-bottom: 32px;
    line-height: 1.5;
  }

  .subtitle strong {
    color: #ff6b6b;
    -webkit-text-fill-color: #ff6b6b;
  }

  .stats {
    display: flex;
    gap: 40px;
    justify-content: center;
    margin-bottom: 36px;
  }

  .stat {
    text-align: center;
  }

  .stat-number {
    font-size: 48px;
    font-weight: 800;
    color: #e67e22;
    line-height: 1;
  }

  .stat-label {
    font-size: 13px;
    color: #8892a4;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 6px;
  }

  .location {
    font-size: 16px;
    color: #8892a4;
    margin-bottom: 32px;
  }

  .location strong {
    color: #fff;
  }

  .actions {
    display: flex;
    gap: 16px;
    justify-content: center;
  }

  .btn {
    padding: 14px 32px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: transform 0.15s;
  }

  .btn:hover { transform: scale(1.03); }

  .btn-primary {
    background: linear-gradient(135deg, #e74c3c, #c0392b);
    color: #fff;
    box-shadow: 0 8px 30px rgba(231,76,60,0.3);
  }

  .btn-secondary {
    background: rgba(255,255,255,0.08);
    color: #ccc;
    border: 1px solid rgba(255,255,255,0.15);
  }

  .timestamp {
    position: fixed;
    bottom: 20px;
    font-size: 13px;
    color: #555;
    z-index: 5;
  }

  /* Dismiss with Escape */
  .dismiss-hint {
    position: fixed;
    top: 20px;
    right: 24px;
    font-size: 12px;
    color: #555;
    z-index: 15;
  }

  @media (max-width: 600px) {
    h1 { font-size: 28px !important; }
    .subtitle { font-size: 16px !important; }
    .icon { font-size: 48px !important; }
    .stats { flex-direction: column; gap: 20px; }
    .stat-number { font-size: 36px; }
    .stat-label { font-size: 11px; }
    .actions { flex-direction: column; gap: 12px; }
    .btn { width: 100%; text-align: center; }
    .content { padding: 0 20px; }
    .alert-badge { font-size: 11px; padding: 6px 14px; letter-spacing: 1px; }
    .location { font-size: 14px; }
    .radar-bg, .radar-ring { display: none; }
    body::after { display: none; }
  }
</style>
</head>
<body>
  <div class="radar-bg"></div>
  <div class="radar-ring ring-1"></div>
  <div class="radar-ring ring-2"></div>
  <div class="radar-ring ring-3"></div>

  <div class="dismiss-hint">Press ESC to dismiss</div>

  <div class="content">
    <div class="alert-badge">
      <span class="dot"></span>
      Micro Burst Event Detected
    </div>

    <div class="icon">🌪️</div>

    <h1>STORM ALERT</h1>

    <p class="subtitle">
      <strong>14 homes</strong> in your CRM may have been damaged<br>
      by a micro burst with <strong>1.75" hail</strong>
    </p>

    <div class="stats">
      <div class="stat">
        <div class="stat-number">14</div>
        <div class="stat-label">Homes Affected</div>
      </div>
      <div class="stat">
        <div class="stat-number">1.75"</div>
        <div class="stat-label">Hail Size</div>
      </div>
      <div class="stat">
        <div class="stat-number">4.2</div>
        <div class="stat-label">Miles from Center</div>
      </div>
    </div>

    <p class="location">
      📍 Impact zone: <strong>Owasso, OK</strong> — detected at <strong>2:30 PM CST</strong><br>
      Source: NOAA Storm Prediction Center
    </p>

    <div class="actions">
      <button class="btn btn-primary" onclick="window.location.href='https://www.uspayments.co/roofer-command-center.html'">
        🚨 View Call List & Details
      </button>
      <button class="btn btn-secondary" onclick="window.close()">
        Dismiss
      </button>
    </div>
  </div>

  <div class="timestamp" id="ts"></div>

  <script>
    // Display current time
    document.getElementById('ts').textContent = 'Alert generated: ' + new Date().toLocaleString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
      hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
    });

    // ESC to dismiss
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') window.close();
    });

    // Play air raid siren alert
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var now = ctx.currentTime;
      
      // Air raid siren - rising and falling tone
      function siren() {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sawtooth';
        gain.gain.value = 0.12;
        
        // Rise and fall pattern
        var t = ctx.currentTime;
        osc.frequency.setValueAtTime(400, t);
        osc.frequency.linearRampToValueAtTime(900, t + 1.5);
        osc.frequency.linearRampToValueAtTime(400, t + 3);
        osc.frequency.linearRampToValueAtTime(900, t + 4.5);
        osc.frequency.linearRampToValueAtTime(400, t + 6);
        
        // Fade out at end
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.linearRampToValueAtTime(0, t + 6);
        
        osc.start(t);
        osc.stop(t + 6);
      }
      siren();
    } catch(e) {}
  </script>
</body>
</html>
